<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Trắc nghiệm Vũ trụ — Ứng dụng kiểm tra kiến thức thiên văn dành cho học sinh cấp 2.">
  <title>🌌 Trắc Nghiệm Vũ Trụ</title>
  <style>
    /* ============================================
       RESET & BIẾN TOÀN CỤC
       ============================================ */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg-deep: #06061a;
      --bg-card: rgba(255,255,255,0.04);
      --bg-card-hover: rgba(255,255,255,0.07);
      --border: rgba(255,255,255,0.08);
      --text-1: #eef0f8;
      --text-2: #8b8db0;
      --text-3: #5a5c7a;
      --purple: #8b5cf6;
      --purple-light: #a78bfa;
      --purple-glow: rgba(139,92,246,0.35);
      --blue: #3b82f6;
      --cyan: #06b6d4;
      --green: #10b981;
      --green-bg: rgba(16,185,129,0.12);
      --green-border: rgba(16,185,129,0.35);
      --red: #ef4444;
      --red-bg: rgba(239,68,68,0.10);
      --red-border: rgba(239,68,68,0.30);
      --gold: #fbbf24;
      --r-lg: 20px;
      --r-md: 14px;
      --r-sm: 8px;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-deep);
      background-image: linear-gradient(rgba(9, 10, 15, 0.45), rgba(9, 10, 15, 0.65)), 
                        url('solar_system_bg.png');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      background-repeat: no-repeat;
      color: var(--text-1);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ============================================
       NỀN SAO & TINH VÂN
       ============================================ */
    body::before, body::after {
      content: ''; position: fixed; pointer-events: none;
    }
    /* Các vệt tinh vân */
    body::before {
      inset: 0;
      background:
        radial-gradient(ellipse 55% 45% at 15% 50%, rgba(139,92,246,0.10) 0%, transparent 70%),
        radial-gradient(ellipse 45% 50% at 85% 30%, rgba(6,182,212,0.08) 0%, transparent 70%),
        radial-gradient(ellipse 50% 40% at 50% 90%, rgba(59,130,246,0.06) 0%, transparent 70%);
      z-index: 0;
      animation: nebulaPulse 18s ease-in-out infinite alternate;
    }
    @keyframes nebulaPulse { 0%{opacity:1;} 100%{opacity:.55;} }

    /* Canvas ngôi sao được vẽ bằng JS, đặt cố định */
    #starfield {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
    }

    /* ============================================
       BỐ CỤC ỨNG DỤNG
       ============================================ */
    .app {
      position: relative; z-index: 1;
      max-width: 720px;
      margin: 0 auto;
      padding: 36px 20px 60px;
      display: flex; flex-direction: column; align-items: center;
      gap: 32px;
      min-height: 100vh;
    }

    /* ===== HEADER ===== */
    .header { text-align: center; animation: fadeDown .65s ease-out; }
    .header h1 {
      font-size: clamp(1.7rem, 5vw, 2.6rem);
      font-weight: 900; letter-spacing: -0.5px;
      background: linear-gradient(135deg, var(--purple-light), var(--cyan), var(--blue));
      background-size: 200% 200%;
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: gradShift 5s ease infinite;
    }
    .header p { color: var(--text-2); font-size: .93rem; margin-top: 5px; }

    @keyframes gradShift { 0%,100%{background-position:0% 50%;}50%{background-position:100% 50%;} }
    @keyframes fadeDown { from{opacity:0;transform:translateY(-18px);}to{opacity:1;transform:translateY(0);} }
    @keyframes fadeUp   { from{opacity:0;transform:translateY(22px);}to{opacity:1;transform:translateY(0);} }

    /* ===== THANH TIẾN TRÌNH ===== */
    .progress-bar-wrap {
      width: 100%; max-width: 560px;
      animation: fadeUp .6s ease-out .1s both;
    }
    .progress-info {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 8px; font-size: .82rem; font-weight: 600;
    }
    .progress-info .step { color: var(--purple-light); }
    .progress-info .score-live { color: var(--cyan); }
    .progress-track {
      width: 100%; height: 7px;
      background: rgba(255,255,255,0.06);
      border-radius: 10px; overflow: hidden;
    }
    .progress-fill {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, var(--purple), var(--cyan));
      border-radius: 10px;
      transition: width .5s cubic-bezier(.4,0,.2,1);
    }

    /* ===== THẺ CÂU HỎI ===== */
    .card {
      width: 100%; max-width: 560px;
      background: var(--bg-card);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      padding: 32px 28px;
      animation: fadeUp .55s ease-out .18s both;
    }

    .q-number {
      font-size: .78rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 2.5px;
      color: var(--purple-light);
      margin-bottom: 10px;
    }
    .q-text {
      font-size: 1.12rem; font-weight: 600; line-height: 1.6;
      margin-bottom: 24px;
    }

    /* ===== CÁC LỰA CHỌN ===== */
    .options { display: flex; flex-direction: column; gap: 10px; }

    .opt-btn {
      display: flex; align-items: center; gap: 12px;
      width: 100%; padding: 14px 18px;
      font-size: .95rem; font-weight: 500; font-family: inherit;
      color: var(--text-1);
      background: rgba(255,255,255,0.03);
      border: 1.5px solid rgba(255,255,255,0.08);
      border-radius: var(--r-md);
      cursor: pointer;
      transition: all .25s ease;
      text-align: left;
    }
    .opt-btn:hover:not(:disabled) {
      background: var(--bg-card-hover);
      border-color: rgba(255,255,255,0.16);
      transform: translateX(4px);
    }

    /* Nhãn chữ cái A, B, C, D */
    .opt-label {
      display: inline-flex; align-items: center; justify-content: center;
      width: 32px; height: 32px; min-width: 32px;
      border-radius: 50%;
      background: rgba(255,255,255,0.06);
      font-weight: 700; font-size: .85rem;
      transition: all .25s;
    }

    /* Trạng thái ĐÚNG */
    .opt-btn.correct {
      background: var(--green-bg);
      border-color: var(--green-border);
    }
    .opt-btn.correct .opt-label {
      background: var(--green); color: #fff;
    }
    /* Trạng thái SAI */
    .opt-btn.wrong {
      background: var(--red-bg);
      border-color: var(--red-border);
    }
    .opt-btn.wrong .opt-label {
      background: var(--red); color: #fff;
    }
    .opt-btn:disabled { cursor: default; }

    /* Giải thích */
    .explanation {
      margin-top: 16px; padding: 14px 16px;
      background: rgba(139,92,246,0.08);
      border-left: 3px solid var(--purple);
      border-radius: 0 var(--r-sm) var(--r-sm) 0;
      font-size: .87rem; line-height: 1.6;
      color: var(--text-2);
      animation: fadeUp .35s ease-out;
    }
    .explanation strong { color: var(--green); }

    /* ===== HÀNG NÚT ĐIỀU HƯỚNG ===== */
    .nav-row {
      width: 100%; max-width: 560px;
      display: flex; justify-content: space-between; align-items: center;
      gap: 12px;
      animation: fadeUp .55s ease-out .25s both;
    }

    .nav-btn {
      padding: 12px 28px;
      font-size: .9rem; font-weight: 600; font-family: inherit;
      border: none; border-radius: 50px; cursor: pointer;
      transition: all .25s; display: flex; align-items: center; gap: 6px;
    }
    .nav-btn:disabled { opacity: .35; cursor: not-allowed; }

    .btn-prev {
      color: var(--text-2);
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
    }
    .btn-prev:hover:not(:disabled) { background: rgba(255,255,255,0.1); }

    .btn-next {
      color: #fff;
      background: linear-gradient(135deg, var(--purple), var(--blue));
      box-shadow: 0 4px 18px var(--purple-glow);
    }
    .btn-next:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(139,92,246,0.45);
    }
    .btn-next:active:not(:disabled) { transform: translateY(0); }

    .btn-submit {
      color: #fff;
      background: linear-gradient(135deg, var(--green), var(--cyan));
      box-shadow: 0 4px 18px rgba(16,185,129,0.3);
    }
    .btn-submit:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(16,185,129,0.4);
    }

    /* ===== MÀN HÌNH KẾT QUẢ ===== */
    .result-screen {
      width: 100%; max-width: 560px;
      text-align: center;
      animation: fadeUp .6s ease-out;
    }
    .result-card {
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      padding: 44px 32px;
    }
    .result-emoji { font-size: 4rem; margin-bottom: 10px; }
    .result-title {
      font-size: 1.6rem; font-weight: 800; margin-bottom: 6px;
    }
    .result-sub { color: var(--text-2); font-size: .92rem; margin-bottom: 22px; }

    /* Vòng tròn điểm */
    .score-ring-wrap {
      width: 160px; height: 160px;
      margin: 0 auto 24px;
      position: relative;
    }
    .score-ring-wrap svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    .score-ring-bg { fill: none; stroke: rgba(255,255,255,0.06); stroke-width: 10; }
    .score-ring-fill {
      fill: none; stroke-width: 10; stroke-linecap: round;
      transition: stroke-dashoffset 1.2s cubic-bezier(.4,0,.2,1);
    }
    .score-ring-text {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
    }
    .score-number { font-size: 2.4rem; font-weight: 900; }
    .score-of { font-size: .82rem; color: var(--text-2); font-weight: 600; }

    /* Phân loại đánh giá */
    .grade-tag {
      display: inline-block;
      padding: 6px 20px;
      border-radius: 30px;
      font-size: .85rem; font-weight: 700;
      margin-bottom: 24px;
    }
    .grade-excellent { background: rgba(16,185,129,0.15); color: var(--green); border: 1px solid var(--green-border); }
    .grade-good      { background: rgba(59,130,246,0.12); color: var(--blue); border: 1px solid rgba(59,130,246,0.3); }
    .grade-ok        { background: rgba(251,191,36,0.12); color: var(--gold); border: 1px solid rgba(251,191,36,0.3); }
    .grade-low       { background: var(--red-bg); color: var(--red); border: 1px solid var(--red-border); }

    /* Chi tiết từng câu */
    .review-list {
      text-align: left;
      display: flex; flex-direction: column; gap: 8px;
      margin-bottom: 28px;
    }
    .review-item {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 14px;
      border-radius: var(--r-sm);
      font-size: .85rem;
      background: rgba(255,255,255,0.025);
      border: 1px solid var(--border);
    }
    .review-icon { font-size: 1.1rem; min-width: 22px; text-align: center; }
    .review-q { flex: 1; color: var(--text-2); }
    .review-ans { font-weight: 600; white-space: nowrap; }
    .review-ans.c { color: var(--green); }
    .review-ans.w { color: var(--red); }

    .retry-btn {
      padding: 14px 44px;
      font-size: 1rem; font-weight: 700; font-family: inherit;
      color: #fff; border: none; border-radius: 50px; cursor: pointer;
      background: linear-gradient(135deg, var(--purple), var(--blue));
      box-shadow: 0 6px 24px var(--purple-glow);
      transition: all .3s;
    }
    .retry-btn:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 10px 36px rgba(139,92,246,0.5);
    }

    /* ===== CONFETTI ===== */
    #confetti { position: fixed; inset: 0; z-index: 100; pointer-events: none; }

    /* ===== ẨN / HIỆN ===== */
    .hidden { display: none !important; }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 500px) {
      .card { padding: 24px 18px; }
      .q-text { font-size: 1rem; }
      .opt-btn { padding: 12px 14px; font-size: .88rem; }
      .result-card { padding: 32px 18px; }
    }
  </style>
</head>
<body>

  <!-- Canvas nền sao -->
  <canvas id="starfield"></canvas>
  <!-- Canvas confetti -->
  <canvas id="confetti"></canvas>

  <div class="app" id="app">

    <!-- Header -->
    <header class="header">
      <h1>🌌 Trắc Nghiệm Vũ Trụ</h1>
      <p>Khám phá kiến thức thiên văn qua 10 câu hỏi thú vị!</p>
    </header>

    <!-- ====== MÀN HÌNH CÂU HỎI ====== -->
    <div id="quizScreen" class="quiz-screen" style="width:100%;max-width:560px;display:flex;flex-direction:column;align-items:center;gap:24px;">

      <!-- Thanh tiến trình -->
      <div class="progress-bar-wrap">
        <div class="progress-info">
          <span class="step" id="stepLabel">Câu 1 / 10</span>
          <span class="score-live" id="scoreLive">Điểm: 0</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" id="progressFill"></div>
        </div>
      </div>

      <!-- Thẻ câu hỏi -->
      <div class="card" id="questionCard">
        <div class="q-number" id="qNumber">Câu hỏi 1</div>
        <div class="q-text" id="qText"></div>
        <div class="options" id="optionsWrap"></div>
        <div class="explanation hidden" id="explanationEl"></div>
      </div>

      <!-- Điều hướng -->
      <div class="nav-row">
        <button class="nav-btn btn-prev" id="prevBtn" disabled>← Câu trước</button>
        <button class="nav-btn btn-next" id="nextBtn">Tiếp theo →</button>
      </div>

    </div>

    <!-- ====== MÀN HÌNH KẾT QUẢ ====== -->
    <div id="resultScreen" class="result-screen hidden">
      <div class="result-card">
        <div class="result-emoji" id="resEmoji">🏆</div>
        <div class="result-title" id="resTitle">Kết quả</div>
        <div class="result-sub" id="resSub">Bạn đã hoàn thành bài trắc nghiệm!</div>

        <!-- Vòng tròn điểm -->
        <div class="score-ring-wrap">
          <svg viewBox="0 0 160 160">
            <circle class="score-ring-bg" cx="80" cy="80" r="68"/>
            <circle class="score-ring-fill" id="ringFill" cx="80" cy="80" r="68"
                    stroke="url(#ringGrad)" stroke-dasharray="427.26" stroke-dashoffset="427.26"/>
            <defs>
              <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="var(--purple)"/>
                <stop offset="100%" stop-color="var(--cyan)"/>
              </linearGradient>
            </defs>
          </svg>
          <div class="score-ring-text">
            <span class="score-number" id="scoreNum">0</span>
            <span class="score-of">/ 10</span>
          </div>
        </div>

        <div id="gradeTag" class="grade-tag grade-excellent"></div>
        <div class="review-list" id="reviewList"></div>
        <button class="retry-btn" id="retryBtn">🔄 Làm lại</button>
      </div>
    </div>

  </div>

  <script>
  (function () {
    'use strict';

    // ═══════════════════════════════════════════════
    // DỮ LIỆU: 10 CÂU HỎI TRẮC NGHIỆM VỀ VŨ TRỤ
    // ═══════════════════════════════════════════════

    var questions = [
      {
        q: 'Hành tinh nào trong Hệ Mặt Trời có kích thước lớn nhất?',
        opts: ['Sao Thổ', 'Sao Mộc', 'Sao Thiên Vương', 'Sao Hải Vương'],
        ans: 1,
        explain: 'Sao Mộc (Jupiter) là hành tinh lớn nhất Hệ Mặt Trời, có đường kính khoảng 139.820 km — gấp hơn 11 lần Trái Đất.'
      },
      {
        q: 'Ánh sáng từ Mặt Trời mất khoảng bao lâu để đến được Trái Đất?',
        opts: ['8 giây', '8 phút', '8 giờ', '8 ngày'],
        ans: 1,
        explain: 'Ánh sáng di chuyển với vận tốc khoảng 300.000 km/s, và khoảng cách từ Mặt Trời đến Trái Đất là ~150 triệu km, nên mất khoảng 8 phút 20 giây.'
      },
      {
        q: 'Mặt Trăng mất bao lâu để quay một vòng quanh Trái Đất?',
        opts: ['Khoảng 7 ngày', 'Khoảng 14 ngày', 'Khoảng 27 ngày', 'Khoảng 60 ngày'],
        ans: 2,
        explain: 'Mặt Trăng quay quanh Trái Đất với chu kì khoảng 27,3 ngày (chu kì thiên văn). Đây cũng là lí do chúng ta thấy các pha Mặt Trăng thay đổi theo tháng.'
      },
      {
        q: 'Hành tinh nào được gọi là "Hành tinh Đỏ"?',
        opts: ['Sao Kim', 'Sao Hoả', 'Sao Mộc', 'Sao Thuỷ'],
        ans: 1,
        explain: 'Sao Hoả (Mars) có bề mặt giàu oxit sắt (gỉ sắt) nên mang màu đỏ cam đặc trưng, vì thế được gọi là "Hành tinh Đỏ".'
      },
      {
        q: 'Dải Ngân Hà thuộc loại thiên hà nào?',
        opts: ['Thiên hà elip', 'Thiên hà xoắn ốc', 'Thiên hà vô định hình', 'Thiên hà thấu kính'],
        ans: 1,
        explain: 'Dải Ngân Hà là một thiên hà xoắn ốc có thanh (barred spiral galaxy), có đường kính khoảng 100.000 năm ánh sáng và chứa hàng trăm tỉ ngôi sao.'
      },
      {
        q: 'Ngôi sao gần Trái Đất nhất (ngoài Mặt Trời) là ngôi sao nào?',
        opts: ['Sao Bắc Cực (Polaris)', 'Proxima Centauri', 'Sao Thiên Lang (Sirius)', 'Sao Chức Nữ (Vega)'],
        ans: 1,
        explain: 'Proxima Centauri nằm cách Trái Đất khoảng 4,24 năm ánh sáng, thuộc hệ sao Alpha Centauri, là ngôi sao gần nhất ngoài Mặt Trời.'
      },
      {
        q: 'Trên Mặt Trăng, một người nhảy sẽ bay cao hơn trên Trái Đất vì lí do gì?',
        opts: [
          'Mặt Trăng không có khí quyển',
          'Lực hấp dẫn trên Mặt Trăng yếu hơn Trái Đất',
          'Mặt Trăng quay nhanh hơn Trái Đất',
          'Nhiệt độ trên Mặt Trăng rất thấp'
        ],
        ans: 1,
        explain: 'Lực hấp dẫn trên Mặt Trăng chỉ bằng khoảng 1/6 so với Trái Đất (do khối lượng nhỏ hơn). Vì vậy, cùng một lực nhảy, bạn sẽ bay cao gấp khoảng 6 lần!'
      },
      {
        q: 'Hành tinh nào trong Hệ Mặt Trời có nhiều vệ tinh (mặt trăng) tự nhiên nhất tính đến nay?',
        opts: ['Sao Mộc', 'Sao Thổ', 'Sao Thiên Vương', 'Sao Hải Vương'],
        ans: 1,
        explain: 'Tính đến năm 2024, Sao Thổ giữ kỷ lục với hơn 140 vệ tinh tự nhiên được xác nhận, vượt qua Sao Mộc (khoảng 95 vệ tinh).'
      },
      {
        q: 'Hiện tượng nhật thực xảy ra khi nào?',
        opts: [
          'Trái Đất nằm giữa Mặt Trời và Mặt Trăng',
          'Mặt Trăng nằm giữa Mặt Trời và Trái Đất',
          'Mặt Trời nằm giữa Trái Đất và Mặt Trăng',
          'Ba thiên thể tạo thành tam giác'
        ],
        ans: 1,
        explain: 'Nhật thực xảy ra khi Mặt Trăng đi vào giữa Mặt Trời và Trái Đất, che khuất một phần hoặc toàn bộ ánh sáng Mặt Trời chiếu đến Trái Đất.'
      },
      {
        q: 'Hành tinh nào có vành đai (rings) rõ ràng và nổi tiếng nhất trong Hệ Mặt Trời?',
        opts: ['Sao Mộc', 'Sao Thiên Vương', 'Sao Thổ', 'Sao Hải Vương'],
        ans: 2,
        explain: 'Sao Thổ (Saturn) nổi tiếng với hệ thống vành đai rộng lớn và tuyệt đẹp, được cấu tạo chủ yếu từ các hạt băng và đá có kích thước từ hạt cát đến ngôi nhà.'
      }
    ];

    // ─── TRẠNG THÁI ──────────────────────────────
    var current   = 0;             // Chỉ số câu hỏi hiện tại
    var score     = 0;             // Điểm tích luỹ
    var answered  = [];            // Mảng lưu chỉ số đáp án đã chọn (-1 = chưa)
    var total     = questions.length;

    // Khởi tạo mảng answered
    for (var i = 0; i < total; i++) answered.push(-1);

    // ─── DOM ─────────────────────────────────────
    var quizScreen   = document.getElementById('quizScreen');
    var resultScreen = document.getElementById('resultScreen');
    var stepLabel    = document.getElementById('stepLabel');
    var scoreLive    = document.getElementById('scoreLive');
    var progressFill = document.getElementById('progressFill');
    var qNumber      = document.getElementById('qNumber');
    var qText        = document.getElementById('qText');
    var optionsWrap  = document.getElementById('optionsWrap');
    var explanationEl= document.getElementById('explanationEl');
    var prevBtn      = document.getElementById('prevBtn');
    var nextBtn      = document.getElementById('nextBtn');
    var retryBtn     = document.getElementById('retryBtn');

    // ═══════════════════════════════════════════════
    // RENDER CÂU HỎI
    // ═══════════════════════════════════════════════

    var LETTERS = ['A', 'B', 'C', 'D'];

    function renderQuestion() {
      var q = questions[current];

      // Cập nhật thanh tiến trình
      stepLabel.textContent = 'Câu ' + (current + 1) + ' / ' + total;
      scoreLive.textContent = 'Điểm: ' + score;
      progressFill.style.width = ((current + 1) / total * 100) + '%';

      // Tiêu đề & nội dung câu hỏi
      qNumber.textContent = 'Câu hỏi ' + (current + 1);
      qText.textContent = q.q;

      // Tạo các nút lựa chọn
      optionsWrap.innerHTML = '';
      var alreadyAnswered = answered[current] !== -1;

      for (var i = 0; i < q.opts.length; i++) {
        var btn = document.createElement('button');
        btn.className = 'opt-btn';
        btn.type = 'button';
        btn.setAttribute('data-idx', i);
        btn.innerHTML = '<span class="opt-label">' + LETTERS[i] + '</span> <span>' + esc(q.opts[i]) + '</span>';

        // Nếu đã trả lời → hiển thị trạng thái đúng/sai
        if (alreadyAnswered) {
          btn.disabled = true;
          if (i === q.ans) btn.classList.add('correct');
          if (i === answered[current] && i !== q.ans) btn.classList.add('wrong');
        } else {
          btn.addEventListener('click', handleAnswer);
        }

        optionsWrap.appendChild(btn);
      }

      // Hiển thị/ẩn giải thích
      if (alreadyAnswered) {
        explanationEl.innerHTML = '💡 <strong>Giải thích:</strong> ' + esc(q.explain);
        explanationEl.classList.remove('hidden');
      } else {
        explanationEl.classList.add('hidden');
      }

      // Cập nhật nút điều hướng
      prevBtn.disabled = (current === 0);

      // Nút cuối → "Xem kết quả" nếu đã trả lời hết
      var allDone = answered.every(function (a) { return a !== -1; });
      if (current === total - 1 && allDone) {
        nextBtn.textContent = '📊 Xem kết quả';
        nextBtn.className = 'nav-btn btn-submit';
      } else {
        nextBtn.textContent = 'Tiếp theo →';
        nextBtn.className = 'nav-btn btn-next';
      }
      nextBtn.disabled = false;

      // Hiệu ứng nhẹ khi chuyển câu
      var card = document.getElementById('questionCard');
      card.style.animation = 'none';
      void card.offsetWidth;
      card.style.animation = 'fadeUp .35s ease-out';
    }

    // ═══════════════════════════════════════════════
    // XỬ LÝ CHỌN ĐÁP ÁN
    // ═══════════════════════════════════════════════

    function handleAnswer(e) {
      var btn = e.currentTarget;
      var idx = parseInt(btn.getAttribute('data-idx'), 10);
      var q   = questions[current];

      answered[current] = idx;

      // Tính điểm
      if (idx === q.ans) score++;

      // Disable tất cả nút & đánh dấu đúng/sai
      var btns = optionsWrap.querySelectorAll('.opt-btn');
      for (var i = 0; i < btns.length; i++) {
        btns[i].disabled = true;
        var bi = parseInt(btns[i].getAttribute('data-idx'), 10);
        if (bi === q.ans) btns[i].classList.add('correct');
        if (bi === idx && bi !== q.ans) btns[i].classList.add('wrong');
      }

      // Hiện giải thích
      explanationEl.innerHTML = '💡 <strong>Giải thích:</strong> ' + esc(q.explain);
      explanationEl.classList.remove('hidden');

      // Cập nhật điểm live
      scoreLive.textContent = 'Điểm: ' + score;

      // Cập nhật nút "Xem kết quả" nếu đây là câu cuối & tất cả đã trả lời
      var allDone = answered.every(function (a) { return a !== -1; });
      if (current === total - 1 && allDone) {
        nextBtn.textContent = '📊 Xem kết quả';
        nextBtn.className = 'nav-btn btn-submit';
      }
    }

    // ═══════════════════════════════════════════════
    // ĐIỀU HƯỚNG
    // ═══════════════════════════════════════════════

    prevBtn.addEventListener('click', function () {
      if (current > 0) { current--; renderQuestion(); }
    });

    nextBtn.addEventListener('click', function () {
      var allDone = answered.every(function (a) { return a !== -1; });
      if (current === total - 1 && allDone) {
        showResult();
      } else if (current < total - 1) {
        current++;
        renderQuestion();
      }
    });

    // ═══════════════════════════════════════════════
    // MÀN HÌNH KẾT QUẢ
    // ═══════════════════════════════════════════════

    function showResult() {
      quizScreen.classList.add('hidden');
      resultScreen.classList.remove('hidden');

      // Emoji & nhận xét theo mức điểm
      var pct = score / total;
      var emoji, title, sub, gradeCls;

      if (pct >= 0.9) {
        emoji = '🏆'; title = 'Xuất sắc!';
        sub = 'Bạn có kiến thức thiên văn tuyệt vời!';
        gradeCls = 'grade-excellent';
      } else if (pct >= 0.7) {
        emoji = '🌟'; title = 'Rất giỏi!';
        sub = 'Kiến thức vũ trụ của bạn khá vững chắc.';
        gradeCls = 'grade-good';
      } else if (pct >= 0.5) {
        emoji = '🚀'; title = 'Khá tốt!';
        sub = 'Cố gắng thêm một chút nữa nhé!';
        gradeCls = 'grade-ok';
      } else {
        emoji = '📚'; title = 'Cần học thêm!';
        sub = 'Hãy đọc thêm về vũ trụ và thử lại nhé.';
        gradeCls = 'grade-low';
      }

      document.getElementById('resEmoji').textContent = emoji;
      document.getElementById('resTitle').textContent = title;
      document.getElementById('resSub').textContent = sub;

      var gradeTag = document.getElementById('gradeTag');
      gradeTag.textContent = score + ' / ' + total + ' điểm (' + Math.round(pct * 100) + '%)';
      gradeTag.className = 'grade-tag ' + gradeCls;

      // Vòng tròn điểm — animate
      var ring = document.getElementById('ringFill');
      var circ = 2 * Math.PI * 68; // ≈ 427.26
      var offset = circ - (circ * pct);
      setTimeout(function () { ring.style.strokeDashoffset = offset; }, 100);

      document.getElementById('scoreNum').textContent = score;

      // Danh sách review từng câu
      var reviewHtml = '';
      for (var i = 0; i < total; i++) {
        var isCorrect = answered[i] === questions[i].ans;
        var icon = isCorrect ? '✅' : '❌';
        var ansCls = isCorrect ? 'c' : 'w';
        var userAns = answered[i] >= 0 ? questions[i].opts[answered[i]] : '—';
        // Rút gọn câu hỏi nếu quá dài
        var shortQ = questions[i].q.length > 50 ? questions[i].q.slice(0, 48) + '…' : questions[i].q;
        reviewHtml += '<div class="review-item">'
          + '<span class="review-icon">' + icon + '</span>'
          + '<span class="review-q">' + esc(shortQ) + '</span>'
          + '<span class="review-ans ' + ansCls + '">' + esc(userAns) + '</span>'
          + '</div>';
      }
      document.getElementById('reviewList').innerHTML = reviewHtml;

      // Confetti nếu giỏi
      if (pct >= 0.7) fireConfetti();
    }

    // ═══════════════════════════════════════════════
    // LÀM LẠI
    // ═══════════════════════════════════════════════

    retryBtn.addEventListener('click', function () {
      current = 0;
      score = 0;
      for (var i = 0; i < total; i++) answered[i] = -1;

      // Reset ring
      document.getElementById('ringFill').style.strokeDashoffset = 427.26;

      resultScreen.classList.add('hidden');
      quizScreen.classList.remove('hidden');
      renderQuestion();
    });

    // ═══════════════════════════════════════════════
    // NỀN SAO NHẤP NHÁY (STARFIELD)
    // ═══════════════════════════════════════════════

    var starCvs = document.getElementById('starfield');
    var starCtx = starCvs.getContext('2d');
    var stars   = [];

    function initStars() {
      starCvs.width  = window.innerWidth;
      starCvs.height = window.innerHeight;
      stars = [];
      var count = Math.min(200, Math.floor(starCvs.width * starCvs.height / 5000));
      for (var i = 0; i < count; i++) {
        stars.push({
          x: Math.random() * starCvs.width,
          y: Math.random() * starCvs.height,
          r: .4 + Math.random() * 1.4,
          a: .3 + Math.random() * .7,          // alpha
          speed: .003 + Math.random() * .008,   // tốc độ nhấp nháy
          phase: Math.random() * Math.PI * 2
        });
      }
    }

    function drawStars(t) {
      starCtx.clearRect(0, 0, starCvs.width, starCvs.height);
      for (var i = 0; i < stars.length; i++) {
        var s = stars[i];
        var alpha = s.a * (.55 + .45 * Math.sin(t * s.speed + s.phase));
        starCtx.beginPath();
        starCtx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        starCtx.fillStyle = 'rgba(255,255,255,' + alpha.toFixed(3) + ')';
        starCtx.fill();
      }
      requestAnimationFrame(drawStars);
    }

    window.addEventListener('resize', initStars);
    initStars();
    requestAnimationFrame(drawStars);

    // ═══════════════════════════════════════════════
    // CONFETTI 🎊
    // ═══════════════════════════════════════════════

    var confCvs = document.getElementById('confetti');
    var confCtx = confCvs.getContext('2d');
    var confParts = [], confRaf = null;
    var PALETTE = ['#8b5cf6','#06b6d4','#10b981','#fbbf24','#ef4444','#ec4899','#3b82f6','#f97316'];

    function fireConfetti() {
      confCvs.width  = window.innerWidth;
      confCvs.height = window.innerHeight;
      confParts = [];
      for (var i = 0; i < 140; i++) {
        confParts.push({
          x: Math.random() * confCvs.width,
          y: -Math.random() * confCvs.height,
          w: 5 + Math.random() * 7,
          h: 3 + Math.random() * 5,
          c: PALETTE[Math.floor(Math.random() * PALETTE.length)],
          vx: (Math.random() - .5) * 5,
          vy: 2 + Math.random() * 5,
          r: Math.random() * 360,
          rs: (Math.random() - .5) * 14,
          o: 1
        });
      }
      if (confRaf) cancelAnimationFrame(confRaf);
      tickConf();
    }

    function tickConf() {
      confCtx.clearRect(0, 0, confCvs.width, confCvs.height);
      var alive = false;
      for (var i = 0; i < confParts.length; i++) {
        var p = confParts[i];
        if (p.o <= 0) continue;
        alive = true;
        p.x += p.vx; p.y += p.vy;
        p.vy += .065; p.r += p.rs;
        if (p.y > confCvs.height * .72) p.o -= .018;
        confCtx.save();
        confCtx.translate(p.x, p.y);
        confCtx.rotate(p.r * Math.PI / 180);
        confCtx.globalAlpha = Math.max(0, p.o);
        confCtx.fillStyle = p.c;
        confCtx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        confCtx.restore();
      }
      if (alive) confRaf = requestAnimationFrame(tickConf);
      else confCtx.clearRect(0, 0, confCvs.width, confCvs.height);
    }

    // ═══════════════════════════════════════════════
    // TIỆN ÍCH
    // ═══════════════════════════════════════════════

    function esc(s) {
      var d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    // ═══════════════════════════════════════════════
    // KHỞI TẠO
    // ═══════════════════════════════════════════════
    renderQuestion();

  })();
  </script>
