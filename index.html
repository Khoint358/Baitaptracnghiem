<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="Vòng quay may mắn - Ứng dụng giải trí tương tác với vòng quay ngẫu nhiên công bằng.">
  <title>🎯 Vòng Quay May Mắn</title>
  <style>
    /* ===== RESET & BASE ===== */
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

    :root {
      --bg-primary: #b91c1c;
      --bg-secondary: rgba(255, 255, 255, 0.04);
      --bg-glass: rgba(255, 255, 255, 0.06);
      --border-glass: rgba(255, 255, 255, 0.1);
      --text-primary: #f0f0f5;
      --text-secondary: #9d9db5;
      --accent-1: #6c5ce7;
      --accent-2: #a29bfe;
      --accent-glow: rgba(108, 92, 231, 0.4);
      --success: #00cec9;
      --danger: #ff6b6b;
      --gold: #ffd700;
      --radius-lg: 20px;
      --radius-md: 12px;
      --radius-sm: 8px;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* ===== ANIMATED BACKGROUND ===== */
    body::before {
      content: '';
      position: fixed;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background:
        radial-gradient(circle at 20% 50%, rgba(108, 92, 231, 0.12) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(0, 206, 201, 0.08) 0%, transparent 50%),
        radial-gradient(circle at 50% 80%, rgba(255, 107, 107, 0.06) 0%, transparent 50%);
      animation: bgShift 20s ease-in-out infinite alternate;
      z-index: 0;
      pointer-events: none;
    }

    @keyframes bgShift {
      0% {
        transform: translate(0, 0) rotate(0deg);
      }

      100% {
        transform: translate(-3%, -3%) rotate(8deg);
      }
    }

    /* ===== LAYOUT ===== */
    .app-container {
      position: relative;
      z-index: 1;
      max-width: 1200px;
      margin: 0 auto;
      padding: 30px 20px 50px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 36px;
    }

    /* ===== HEADER ===== */
    .app-header {
      text-align: center;
      animation: fadeInDown 0.8s ease-out;
    }

    .app-header h1 {
      font-size: 2.6rem;
      font-weight: 900;
      background: linear-gradient(135deg, #a29bfe, #6c5ce7, #00cec9);
      background-size: 200% 200%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: gradientText 4s ease infinite;
      letter-spacing: -1px;
    }

    .app-header p {
      color: var(--text-secondary);
      font-size: 1rem;
      margin-top: 6px;
      font-weight: 400;
    }

    @keyframes gradientText {

      0%,
      100% {
        background-position: 0% 50%;
      }

      50% {
        background-position: 100% 50%;
      }
    }

    @keyframes fadeInDown {
      from {
        opacity: 0;
        transform: translateY(-24px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ===== MAIN CONTENT AREA ===== */
    .main-content {
      display: flex;
      gap: 36px;
      width: 100%;
      align-items: flex-start;
      justify-content: center;
      flex-wrap: wrap;
      animation: fadeInUp 0.8s ease-out 0.15s both;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ===== WHEEL SECTION ===== */
    .wheel-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
    }

    .wheel-wrapper {
      position: relative;
      width: 420px;
      height: 420px;
      filter: drop-shadow(0 0 40px var(--accent-glow));
    }

    /* Outer glowing ring */
    .wheel-wrapper::before {
      content: '';
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      background: conic-gradient(from 0deg,
          #6c5ce7, #a29bfe, #00cec9, #ffd700, #ff6b6b, #fd79a8, #6c5ce7);
      opacity: 0.5;
      animation: ringRotate 8s linear infinite;
      z-index: 0;
    }

    .wheel-wrapper::after {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      background: var(--bg-primary);
      z-index: 1;
    }

    @keyframes ringRotate {
      to {
        transform: rotate(360deg);
      }
    }

    #wheelCanvas {
      position: relative;
      z-index: 2;
      border-radius: 50%;
      cursor: pointer;
      transition: filter 0.3s;
    }

    #wheelCanvas:hover {
      filter: brightness(1.05);
    }

    /* ===== POINTER / KIM CHỈ ===== */
    .pointer {
      position: absolute;
      top: -18px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      width: 0;
      height: 0;
      border-left: 18px solid transparent;
      border-right: 18px solid transparent;
      border-top: 40px solid var(--gold);
      filter: drop-shadow(0 4px 12px rgba(255, 215, 0, 0.5));
      transition: transform 0.15s;
    }

    .pointer.bounce {
      animation: pointerBounce 0.3s ease;
    }

    @keyframes pointerBounce {

      0%,
      100% {
        transform: translateX(-50%) translateY(0);
      }

      50% {
        transform: translateX(-50%) translateY(6px);
      }
    }

    /* Center hub */
    .center-hub {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 5;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #fff 0%, #e0e0e0 60%, #aaa 100%);
      box-shadow:
        0 4px 20px rgba(0, 0, 0, 0.5),
        inset 0 2px 6px rgba(255, 255, 255, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      pointer-events: none;
    }

    /* ===== SPIN BUTTON ===== */
    .spin-btn {
      position: relative;
      padding: 16px 56px;
      font-size: 1.15rem;
      font-weight: 700;
      font-family: inherit;
      color: #fff;
      border: none;
      border-radius: 60px;
      cursor: pointer;
      background: linear-gradient(135deg, #6c5ce7, #a29bfe);
      box-shadow:
        0 6px 30px var(--accent-glow),
        inset 0 1px 0 rgba(255, 255, 255, 0.2);
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 2px;
      overflow: hidden;
    }

    .spin-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.15), transparent);
      opacity: 0;
      transition: opacity 0.3s;
    }

    .spin-btn:hover:not(:disabled) {
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 10px 40px rgba(108, 92, 231, 0.55);
    }

    .spin-btn:hover:not(:disabled)::before {
      opacity: 1;
    }

    .spin-btn:active:not(:disabled) {
      transform: translateY(0) scale(0.98);
    }

    .spin-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      filter: grayscale(0.3);
    }

    /* ===== PANEL (Settings) ===== */
    .panel {
      background: var(--bg-glass);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-lg);
      padding: 28px;
      width: 340px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      animation: fadeInUp 0.8s ease-out 0.3s both;
    }

    .panel-title {
      font-size: 1.2rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .panel-title .icon {
      font-size: 1.4rem;
    }

    .panel-desc {
      font-size: 0.85rem;
      color: var(--text-secondary);
      line-height: 1.5;
    }

    .panel textarea {
      width: 100%;
      min-height: 180px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      font-family: inherit;
      font-size: 0.95rem;
      color: var(--text-primary);
      resize: vertical;
      transition: border-color 0.3s, box-shadow 0.3s;
      line-height: 1.7;
    }

    .panel textarea:focus {
      outline: none;
      border-color: var(--accent-2);
      box-shadow: 0 0 0 3px rgba(162, 155, 254, 0.15);
    }

    .panel textarea::placeholder {
      color: var(--text-secondary);
      opacity: 0.6;
    }

    .update-btn {
      padding: 13px 24px;
      font-size: 0.95rem;
      font-weight: 600;
      font-family: inherit;
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      background: linear-gradient(135deg, #00cec9, #00b894);
      box-shadow: 0 4px 18px rgba(0, 206, 201, 0.25);
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .update-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 24px rgba(0, 206, 201, 0.4);
    }

    .update-btn:active {
      transform: translateY(0);
    }

    /* Item count badge */
    .item-count {
      font-size: 0.8rem;
      color: var(--accent-2);
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .item-count .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: rgba(108, 92, 231, 0.2);
      border: 1px solid rgba(108, 92, 231, 0.3);
      border-radius: 20px;
      padding: 2px 10px;
      font-weight: 700;
      min-width: 28px;
    }

    /* ===== HISTORY SECTION ===== */
    .history-section {
      width: 100%;
      max-width: 760px;
      animation: fadeInUp 0.8s ease-out 0.45s both;
    }

    .history-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .history-header h3 {
      font-size: 1.05rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .clear-history-btn {
      padding: 6px 14px;
      font-size: 0.78rem;
      font-weight: 600;
      font-family: inherit;
      color: var(--danger);
      background: rgba(255, 107, 107, 0.1);
      border: 1px solid rgba(255, 107, 107, 0.2);
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all 0.2s;
    }

    .clear-history-btn:hover {
      background: rgba(255, 107, 107, 0.2);
    }

    .history-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .history-item {
      background: var(--bg-glass);
      border: 1px solid var(--border-glass);
      border-radius: 30px;
      padding: 6px 16px;
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 6px;
      animation: popIn 0.35s ease-out;
    }

    .history-item .h-num {
      color: var(--accent-2);
      font-weight: 700;
      font-size: 0.75rem;
    }

    @keyframes popIn {
      from {
        opacity: 0;
        transform: scale(0.7);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .history-empty {
      color: var(--text-secondary);
      font-size: 0.85rem;
      font-style: italic;
    }

    /* ===== RESULT OVERLAY / POPUP ===== */
    .result-overlay {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(8px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    .result-overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    .result-card {
      background: linear-gradient(145deg, rgba(30, 30, 60, 0.95), rgba(15, 15, 35, 0.98));
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: var(--radius-lg);
      padding: 48px 52px;
      text-align: center;
      transform: scale(0.7) translateY(30px);
      transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.6),
        0 0 60px var(--accent-glow);
      max-width: 440px;
      width: 90%;
    }

    .result-overlay.active .result-card {
      transform: scale(1) translateY(0);
    }

    .result-emoji {
      font-size: 4rem;
      margin-bottom: 12px;
      animation: bounce 0.6s ease infinite alternate;
    }

    @keyframes bounce {
      from {
        transform: translateY(0);
      }

      to {
        transform: translateY(-10px);
      }
    }

    .result-label {
      font-size: 0.9rem;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 3px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .result-value {
      font-size: 2rem;
      font-weight: 900;
      background: linear-gradient(135deg, var(--gold), #ffaa00);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 28px;
      line-height: 1.3;
    }

    .close-result-btn {
      padding: 12px 40px;
      font-size: 0.95rem;
      font-weight: 600;
      font-family: inherit;
      color: var(--text-primary);
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 40px;
      cursor: pointer;
      transition: all 0.25s;
    }

    .close-result-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: translateY(-1px);
    }

    /* ===== CONFETTI CANVAS ===== */
    #confettiCanvas {
      position: fixed;
      inset: 0;
      z-index: 999;
      pointer-events: none;
    }

    /* ===== TOAST NOTIFICATION ===== */
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: rgba(30, 30, 50, 0.95);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-md);
      padding: 12px 24px;
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text-primary);
      z-index: 2000;
      opacity: 0;
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      pointer-events: none;
      backdrop-filter: blur(12px);
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 820px) {
      .main-content {
        flex-direction: column;
        align-items: center;
      }

      .panel {
        width: 100%;
        max-width: 420px;
      }

      .wheel-wrapper {
        width: 340px;
        height: 340px;
      }
    }

    @media (max-width: 400px) {
      .wheel-wrapper {
        width: 280px;
        height: 280px;
      }

      .app-header h1 {
        font-size: 1.8rem;
      }

      .result-card {
        padding: 32px 24px;
      }

      .result-value {
        font-size: 1.5rem;
      }
    }
  </style>
</head>

<body>

  <!-- Confetti overlay canvas -->
  <canvas id="confettiCanvas"></canvas>

  <!-- Result popup overlay -->
  <div class="result-overlay" id="resultOverlay">
    <div class="result-card">
      <div class="result-emoji">🎉</div>
      <div class="result-label">Kết quả</div>
      <div class="result-value" id="resultValue">—</div>
      <button class="close-result-btn" id="closeResultBtn">Đóng</button>
    </div>
  </div>

  <!-- Toast notification -->
  <div class="toast" id="toast"></div>

  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <h1>🎯 Vòng Quay May Mắn</h1>
      <p>Nhấn quay và để vận may quyết định!</p>
    </header>

    <!-- Main content: Wheel + Panel -->
    <div class="main-content">

      <!-- Wheel Section -->
      <section class="wheel-section">
        <div class="wheel-wrapper" id="wheelWrapper">
          <div class="pointer" id="pointer"></div>
          <canvas id="wheelCanvas" width="420" height="420"></canvas>
          <div class="center-hub">🎯</div>
        </div>
        <button class="spin-btn" id="spinBtn">🚀 Quay</button>
      </section>

      <!-- Settings Panel -->
      <aside class="panel">
        <div class="panel-title">
          <span class="icon">⚙️</span> Tuỳ chỉnh vòng quay
        </div>
        <p class="panel-desc">
          Nhập mỗi lựa chọn trên một dòng riêng biệt. Nhấn "Cập nhật" để áp dụng thay đổi.
        </p>
        <textarea id="optionsInput" placeholder="Nhập các lựa chọn, mỗi dòng một mục..."></textarea>
        <div class="item-count">
          Số mục: <span class="badge" id="itemCountBadge">6</span>
        </div>
        <button class="update-btn" id="updateBtn">
          ✨ Cập nhật vòng quay
        </button>
      </aside>

    </div>

    <!-- History Section -->
    <section class="history-section" id="historySection">
      <div class="history-header">
        <h3>📜 Lịch sử kết quả</h3>
        <button class="clear-history-btn" id="clearHistoryBtn">Xoá lịch sử</button>
      </div>
      <div class="history-list" id="historyList">
        <span class="history-empty">Chưa có kết quả nào.</span>
      </div>
    </section>
  </div>

  <script>
    // =========================================================
    // ===== CẤU HÌNH MẶC ĐỊNH ================================
    // =========================================================

    /** Danh sách lựa chọn mặc định */
    const DEFAULT_OPTIONS = [
      'Câu cá',
      'Đập đá',
      'Tiệc trò chơi',
      'Bắt bọ+thẻ',
      'Leo tháp',
      'Đào rương'
    ];

    /** Bảng màu cho các ô vòng quay (dùng HSL cho đẹp & đa dạng) */
    const COLORS = [
      '#6c5ce7', '#00cec9', '#fd79a8', '#ffc048',
      '#00b894', '#e17055', '#0984e3', '#d63031',
      '#e84393', '#2d3436', '#636e72', '#55efc4',
      '#74b9ff', '#fab1a0', '#dfe6e9', '#a29bfe'
    ];

    // =========================================================
    // ===== BIẾN TRẠNG THÁI ===================================
    // =========================================================

    let options = [...DEFAULT_OPTIONS];  // Danh sách hiện tại
    let isSpinning = false;              // Đang quay hay không
    let currentAngle = 0;               // Góc quay hiện tại (radian)
    let history = [];                    // Lịch sử kết quả

    // DOM references
    const canvas = document.getElementById('wheelCanvas');
    const ctx = canvas.getContext('2d');
    const spinBtn = document.getElementById('spinBtn');
    const optionsInput = document.getElementById('optionsInput');
    const updateBtn = document.getElementById('updateBtn');
    const itemCountBadge = document.getElementById('itemCountBadge');
    const resultOverlay = document.getElementById('resultOverlay');
    const resultValue = document.getElementById('resultValue');
    const closeResultBtn = document.getElementById('closeResultBtn');
    const historyList = document.getElementById('historyList');
    const clearHistoryBtn = document.getElementById('clearHistoryBtn');
    const pointer = document.getElementById('pointer');
    const toast = document.getElementById('toast');
    const confettiCanvas = document.getElementById('confettiCanvas');
    const confettiCtx = confettiCanvas.getContext('2d');

    // =========================================================
    // ===== VẼ VÒNG QUAY =====================================
    // =========================================================

    /**
     * Vẽ toàn bộ vòng quay dựa trên danh sách options hiện tại.
     * Mỗi ô được chia đều theo góc quay.
     */
    function drawWheel() {
      const size = canvas.width;
      const center = size / 2;
      const radius = center - 4;
      const numSlices = options.length;
      const sliceAngle = (2 * Math.PI) / numSlices;

      ctx.clearRect(0, 0, size, size);

      for (let i = 0; i < numSlices; i++) {
        const startAngle = currentAngle + i * sliceAngle;
        const endAngle = startAngle + sliceAngle;

        // --- Vẽ phần ô ---
        ctx.beginPath();
        ctx.moveTo(center, center);
        ctx.arc(center, center, radius, startAngle, endAngle);
        ctx.closePath();
        ctx.fillStyle = COLORS[i % COLORS.length];
        ctx.fill();

        // --- Viền mỏng giữa các ô ---
        ctx.lineWidth = 2;
        ctx.strokeStyle = 'rgba(255,255,255,0.15)';
        ctx.stroke();

        // --- Vẽ nhãn chữ ---
        ctx.save();
        ctx.translate(center, center);
        const midAngle = startAngle + sliceAngle / 2;
        ctx.rotate(midAngle);

        // Chọn màu chữ tương phản
        ctx.fillStyle = '#fff';
        ctx.font = `bold ${Math.max(11, Math.min(15, 180 / numSlices))}px 'Inter', sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        // Vẽ chữ dọc theo bán kính, offset ra phía ngoài
        const textRadius = radius * 0.62;
        const label = options[i].length > 14
          ? options[i].substring(0, 13) + '…'
          : options[i];

        // Thêm shadow cho dễ đọc
        ctx.shadowColor = 'rgba(0,0,0,0.5)';
        ctx.shadowBlur = 4;
        ctx.fillText(label, textRadius, 0);
        ctx.shadowBlur = 0;

        ctx.restore();
      }

      // --- Viền ngoài ---
      ctx.beginPath();
      ctx.arc(center, center, radius, 0, 2 * Math.PI);
      ctx.lineWidth = 3;
      ctx.strokeStyle = 'rgba(255,255,255,0.2)';
      ctx.stroke();
    }

    // =========================================================
    // ===== LOGIC QUAY ========================================
    // =========================================================

    /**
     * Bắt đầu hiệu ứng quay.
     * - Tạo góc quay ngẫu nhiên lớn (đảm bảo >= vài vòng)
     * - Dùng easing (ease-out cubic) để gia tốc rồi chậm dần
     */
    function startSpin() {
      if (isSpinning || options.length === 0) return;
      isSpinning = true;
      spinBtn.disabled = true;

      // Tổng góc quay: 5-10 vòng + thêm một góc ngẫu nhiên
      const extraTurns = 5 + Math.random() * 5;                   // 5–10 vòng
      const randomSliceOffset = Math.random() * 2 * Math.PI;      // vị trí dừng ngẫu nhiên
      const totalRotation = extraTurns * 2 * Math.PI + randomSliceOffset;

      const startAngle = currentAngle;
      const targetAngle = startAngle + totalRotation;
      const duration = 4000 + Math.random() * 1500; // 4–5.5 giây
      const startTime = performance.now();

      /**
       * Hàm easing: cubic ease-out → quay nhanh lúc đầu, chậm dần cuối
       */
      function easeOutCubic(t) {
        return 1 - Math.pow(1 - t, 3);
      }

      function animateSpin(now) {
        const elapsed = now - startTime;
        const progress = Math.min(elapsed / duration, 1);
        const easedProgress = easeOutCubic(progress);

        currentAngle = startAngle + totalRotation * easedProgress;
        drawWheel();

        // Hiệu ứng pointer nhảy khi đi qua biên ô
        const numSlices = options.length;
        const sliceAngle = (2 * Math.PI) / numSlices;
        const normalised = ((currentAngle % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
        const sliceIndex = Math.floor(normalised / sliceAngle);
        if (animateSpin._lastSlice !== undefined && sliceIndex !== animateSpin._lastSlice) {
          pointer.classList.remove('bounce');
          // Force reflow to restart animation
          void pointer.offsetWidth;
          pointer.classList.add('bounce');
        }
        animateSpin._lastSlice = sliceIndex;

        if (progress < 1) {
          requestAnimationFrame(animateSpin);
        } else {
          // Quay xong → xác định kết quả
          currentAngle = targetAngle % (2 * Math.PI);
          drawWheel();
          determineResult();
        }
      }

      requestAnimationFrame(animateSpin);
    }

    /**
     * Xác định ô mà kim chỉ trúng vào.
     * Kim chỉ ở vị trí "12 giờ" tức góc -π/2 (hoặc 3π/2).
     */
    function determineResult() {
      const numSlices = options.length;
      const sliceAngle = (2 * Math.PI) / numSlices;

      // Kim ở góc -π/2 (đỉnh). Tính góc tương đối so với vòng quay.
      // Ô bắt đầu từ currentAngle + i*sliceAngle
      // Kim ở 3π/2 → normalise lại
      const pointerAngle = (2 * Math.PI) - ((currentAngle + Math.PI / 2) % (2 * Math.PI));
      const normalPointer = ((pointerAngle % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
      const winIndex = Math.floor(normalPointer / sliceAngle) % numSlices;
      const winner = options[winIndex];

      // Thêm vào lịch sử
      history.unshift(winner);
      renderHistory();

      // Hiện popup kết quả
      showResult(winner);

      // Bắn confetti
      launchConfetti();

      isSpinning = false;
      spinBtn.disabled = false;
    }

    // =========================================================
    // ===== POPUP KẾT QUẢ ====================================
    // =========================================================

    function showResult(text) {
      resultValue.textContent = text;
      resultOverlay.classList.add('active');
    }

    function hideResult() {
      resultOverlay.classList.remove('active');
    }

    closeResultBtn.addEventListener('click', hideResult);
    resultOverlay.addEventListener('click', (e) => {
      if (e.target === resultOverlay) hideResult();
    });

    // =========================================================
    // ===== CẬP NHẬT DANH SÁCH ================================
    // =========================================================

    /** Điền textarea bằng danh sách hiện tại */
    function syncTextarea() {
      optionsInput.value = options.join('\n');
      itemCountBadge.textContent = options.length;
    }

    /** Cập nhật vòng quay từ textarea */
    function updateOptionsFromInput() {
      const raw = optionsInput.value.trim();
      if (!raw) {
        showToast('⚠️ Vui lòng nhập ít nhất 2 lựa chọn!');
        return;
      }
      const newOpts = raw
        .split('\n')
        .map(s => s.trim())
        .filter(s => s.length > 0);

      if (newOpts.length < 2) {
        showToast('⚠️ Cần ít nhất 2 lựa chọn để tạo vòng quay.');
        return;
      }

      options = newOpts;
      itemCountBadge.textContent = options.length;
      currentAngle = 0;
      drawWheel();
      showToast(`✅ Đã cập nhật vòng quay với ${options.length} mục!`);
    }

    /** Đếm số mục khi nhập */
    optionsInput.addEventListener('input', () => {
      const count = optionsInput.value
        .split('\n')
        .map(s => s.trim())
        .filter(s => s.length > 0).length;
      itemCountBadge.textContent = count;
    });

    updateBtn.addEventListener('click', updateOptionsFromInput);

    // =========================================================
    // ===== LỊCH SỬ ==========================================
    // =========================================================

    function renderHistory() {
      if (history.length === 0) {
        historyList.innerHTML = '<span class="history-empty">Chưa có kết quả nào.</span>';
        return;
      }
      historyList.innerHTML = history.map((item, i) =>
        `<div class="history-item">
          <span class="h-num">#${i + 1}</span> ${escapeHtml(item)}
        </div>`
      ).join('');
    }

    clearHistoryBtn.addEventListener('click', () => {
      history = [];
      renderHistory();
      showToast('🗑️ Đã xoá lịch sử.');
    });

    // =========================================================
    // ===== TOAST =============================================
    // =========================================================

    let toastTimeout = null;
    function showToast(message) {
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => toast.classList.remove('show'), 2500);
    }

    // =========================================================
    // ===== CONFETTI ==========================================
    // =========================================================

    let confettiParticles = [];
    let confettiAnimId = null;

    function resizeConfetti() {
      confettiCanvas.width = window.innerWidth;
      confettiCanvas.height = window.innerHeight;
    }

    function launchConfetti() {
      resizeConfetti();
      confettiParticles = [];

      // Tạo 120 hạt confetti
      for (let i = 0; i < 120; i++) {
        confettiParticles.push({
          x: Math.random() * confettiCanvas.width,
          y: Math.random() * confettiCanvas.height * -1, // bắt đầu phía trên
          w: 6 + Math.random() * 6,
          h: 4 + Math.random() * 4,
          color: COLORS[Math.floor(Math.random() * COLORS.length)],
          vx: (Math.random() - 0.5) * 4,
          vy: 2 + Math.random() * 4,
          rotation: Math.random() * 360,
          rotSpeed: (Math.random() - 0.5) * 10,
          opacity: 1
        });
      }

      if (confettiAnimId) cancelAnimationFrame(confettiAnimId);
      animateConfetti();
    }

    function animateConfetti() {
      confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
      let alive = false;

      for (const p of confettiParticles) {
        if (p.opacity <= 0) continue;
        alive = true;

        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.07; // trọng lực
        p.rotation += p.rotSpeed;

        // Mờ dần khi rơi xuống dưới
        if (p.y > confettiCanvas.height * 0.7) {
          p.opacity -= 0.015;
        }

        confettiCtx.save();
        confettiCtx.translate(p.x, p.y);
        confettiCtx.rotate((p.rotation * Math.PI) / 180);
        confettiCtx.globalAlpha = Math.max(0, p.opacity);
        confettiCtx.fillStyle = p.color;
        confettiCtx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        confettiCtx.restore();
      }

      if (alive) {
        confettiAnimId = requestAnimationFrame(animateConfetti);
      } else {
        confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
      }
    }

    // =========================================================
    // ===== TIỆN ÍCH ==========================================
    // =========================================================

    /** Escape HTML để tránh XSS khi render lịch sử */
    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    // =========================================================
    // ===== RESPONSIVE CANVAS =================================
    // =========================================================

    function handleResize() {
      const wrapper = document.getElementById('wheelWrapper');
      const wrapperSize = wrapper.clientWidth;
      canvas.width = wrapperSize;
      canvas.height = wrapperSize;
      drawWheel();
    }

    window.addEventListener('resize', () => {
      handleResize();
      resizeConfetti();
    });

    // =========================================================
    // ===== SỰ KIỆN ==========================================
    // =========================================================

    spinBtn.addEventListener('click', startSpin);

    // Cho phép click vào vòng quay để quay
    canvas.addEventListener('click', startSpin);

    // Phím Enter trong textarea → không submit, chỉ xuống dòng bình thường
    // Phím Space trên Spin button
    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space' && document.activeElement === spinBtn) {
        e.preventDefault();
        startSpin();
      }
    });

    // =========================================================
    // ===== KHỞI TẠO =========================================
    // =========================================================

    (function init() {
      syncTextarea();
      handleResize();
      drawWheel();
    })();
  </script>
</body>

</html>
